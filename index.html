<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taliya's Money</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taliya's $">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<!-- Your Supabase URL and key live in config.js, so this file can be replaced with updates without re-entering them. -->
<script src="config.js"></script>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#152330; --muted:#5D6B78; --line:#DDE3E9;
  --accent:#24476B; --accent-ink:#FFFFFF;
  --spend:#D9512C; --save:#17806A; --gift:#7A56B0;
  --spend-soft:#FBE7E0; --save-soft:#DDF1EB; --gift-soft:#EDE5F7;
  --danger:#B3261E; --shadow:0 10px 30px rgba(21,35,48,.10);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F171E; --surface:#17222C; --ink:#E8EEF3; --muted:#9AA8B5; --line:#283643;
  --accent:#8FB8E6; --accent-ink:#0F171E;
  --spend:#F07B57; --save:#44C2A2; --gift:#B394E6;
  --spend-soft:#3A221B; --save-soft:#14322B; --gift-soft:#2B2240;
  --danger:#F2867E; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

header.hero{display:flex;flex-direction:column;gap:4px}
.toprow{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.total{font-family:var(--f-display);font-weight:600;font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:-.02em;margin-top:10px}
.total small{font-size:.45em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px}
.lock{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}

.accounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acct{border:0;text-align:left;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--soft);color:var(--ink);transition:transform .15s}
.acct:active{transform:scale(.97)}
.acct[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tone)}
.acct .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--tone)}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--tone)}
.acct .amt{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,5.6vw,26px);line-height:1.1;overflow-wrap:anywhere}
.t-spending{--tone:var(--spend);--soft:var(--spend-soft)}
.t-savings{--tone:var(--save);--soft:var(--save-soft)}
.t-gift{--tone:var(--gift);--soft:var(--gift-soft)}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px}
.act svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal h2{font-size:15px;margin:0;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--save-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--save);border-radius:99px;width:0;transition:width .6s ease}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:14px}

section.activity{display:flex;flex-direction:column;gap:12px}
.act-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.act-head h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day{padding:10px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.day + .row{border-top:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--tone)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.what{min-width:0}
.what b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.money{font-weight:700}
.money.plus{color:var(--save)}
.tags{display:flex;gap:4px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.pay{color:var(--accent)}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted)}

/* login */
.login{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:18px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;margin:0}
.login p{margin:0;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  max-height:92%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0 0 14px}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;font-weight:500;width:100%;min-width:0}
.amount-in{font-family:var(--f-display);font-size:32px!important;font-weight:600!important}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
.seg input:checked + span{background:var(--soft);border-color:var(--tone);color:var(--tone);box-shadow:inset 0 0 0 1px var(--tone)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg input:disabled + span{opacity:.35}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.receipt-pick{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px;font-weight:600;background:none;width:100%;text-align:left}
.receipt-pick img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:1em}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0 0 16px}
.detail dt{color:var(--muted);font-size:14px}
.detail dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.detail .rimg{width:100%;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
/* tabs & parent */
.topbtns{display:flex;gap:6px}
.lock.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.view{display:flex;flex-direction:column;gap:22px}

/* chores */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center}
.weeknav b span{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;display:grid;place-items:center}
.navbtn:disabled{opacity:.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0;font-weight:700}
.big{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1}
.bar.ch{background:var(--spend-soft)} .bar.ch i{background:var(--accent)}
.split{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--tone)}
.paid{font-weight:700;color:var(--save)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dbtn small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dbtn b{font-size:17px}
.dbtn i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.dbtn.full i{color:var(--save)}
.dbtn.today{border-color:var(--accent)}
.dbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dbtn[aria-pressed="true"] small,.dbtn[aria-pressed="true"] i{color:var(--bg)}
.crow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.crow:first-child{border-top:0}
.crow:disabled{cursor:default}
.box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.box svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.crow.done .box{background:var(--save);border-color:var(--save)}
.crow.done .box svg{opacity:1;stroke:#fff}
.crow.done .cname{text-decoration:line-through;color:var(--muted)}
.cname{font-weight:600;display:block}
.cwhen{font-size:13px;color:var(--muted);display:block}
.erow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow div{min-width:0}
.erow b{display:block;font-weight:600;overflow-wrap:anywhere}
.erow span{font-size:13px;color:var(--muted)}
.dpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dpick label{position:relative}
.dpick input{position:absolute;opacity:0;inset:0}
.dpick span{display:block;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink)}
.dpick input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dpick input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hint{font-size:14px;color:var(--muted);text-align:center}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--save)}
.sw input:checked::after{transform:translateX(20px)}
.sw small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.topic{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.topic code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;font-family:ui-monospace,Menlo,monospace;user-select:all;-webkit-user-select:all}
.topic button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btn.small{padding:11px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60}
/* all-chores-done celebration */
.cheer{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:auto;display:grid;place-items:center;
  background:color-mix(in srgb, var(--bg) 55%, transparent);animation:cheerfade 4.2s ease forwards}
.cheer .hand{position:absolute;bottom:-90px;line-height:1;animation:rise linear forwards;will-change:transform}
.cheer .msg{position:relative;max-width:min(86vw,420px);text-align:center;background:var(--surface);color:var(--ink);
  border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);font-family:var(--f-display);font-weight:800;
  font-size:clamp(24px,7vw,32px);line-height:1.15;text-wrap:balance;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.cheer .msg span{display:block;font-family:var(--f-body);font-weight:600;font-size:17px;color:var(--save);margin-top:8px}
@keyframes rise{from{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-60vh) rotate(10deg)}to{transform:translateY(calc(-100vh - 140px)) rotate(-8deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes cheerfade{0%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cheer .hand{display:none}.cheer .msg{animation:none}}
</style>
</head>
<body>

<!-- ===== password screen ===== -->
<div class="login" id="login" hidden>
  <div class="eyebrow">Family bank</div>
  <h1>Taliya's Money</h1>
  <p>Enter the family password to open Taliya's accounts.</p>
  <form id="loginForm">
    <label class="f">Family password<input type="password" id="pw" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="remember" checked> Remember on this phone</label>
    <div class="err" id="loginErr" role="alert"></div>
    <button type="submit" class="btn primary" id="loginBtn">Open</button>
  </form>
</div>

<!-- ===== main app ===== -->
<div class="app" id="app" hidden>
  <header class="hero">
    <div class="toprow"><div class="eyebrow">Family bank</div><div class="topbtns"><button type="button" class="lock" id="btnParent">Parent</button><button type="button" class="lock" id="btnLock">Lock</button></div></div>
    <h1>Taliya's Money</h1>
    <div class="total num" id="total">$0<small>.00</small></div>
    <div class="sub" id="totalSub">across spending, savings and gifts</div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabMoney" aria-selected="true">Money</button>
    <button type="button" role="tab" id="tabChores" aria-selected="false">Chores</button>
  </div>

  <div class="view" id="choresView" hidden>
    <div class="weeknav">
      <button type="button" class="navbtn" id="wkPrev" aria-label="Previous week">‹</button>
      <b id="wkLabel">This week</b>
      <button type="button" class="navbtn" id="wkNext" aria-label="Next week">›</button>
    </div>
    <div class="card" id="wkSummary"></div>
    <div class="days" id="days" role="group" aria-label="Day of week"></div>
    <div class="list" id="choreList"></div>
    <div id="parentTools"></div>
  </div>

  <div class="view" id="moneyView">
  <div class="accounts" id="accounts" role="group" aria-label="Accounts"></div>

  <div class="actions">
    <button class="act" id="btnAdd" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add money</button>
    <button class="act" id="btnBuy" type="button"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Log purchase</button>
    <button class="act" id="btnMove" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>Move money</button>
  </div>

  <div class="goal">
    <div class="goal-row"><h2 id="goalTitle">Savings goal</h2><button class="link" id="btnGoal" type="button">Set a goal</button></div>
    <div class="bar" aria-hidden="true"><i id="goalBar"></i></div>
    <div class="sub num" id="goalText">Pick something to save for and watch savings fill this bar.</div>
  </div>

  <div class="card" id="bankCard" hidden></div>

  <section class="activity">
    <div class="act-head"><h2>Activity</h2><div class="chips" id="chips" role="group" aria-label="Filter activity"></div></div>
    <div class="list" id="list"></div>
  </section>
  </div>
  <p class="hint" id="appVersion" style="font-size:12px;margin:0"></p>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const CFG = window.FAMILY_CONFIG;
const ACCTS = [{id:"spending",name:"Spending"},{id:"savings",name:"Savings"},{id:"gift",name:"Gifts"}];
const ICON = {
  deposit:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  purchase:'<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',

};

const mkStore = KEY => ({ get(){ try{return localStorage.getItem(KEY);}catch(e){return null;} },
  set(v){ try{localStorage.setItem(KEY,v);}catch(e){} }, clear(){ try{localStorage.removeItem(KEY);}catch(e){} } });

/* ---------- helpers ---------- */
const fmt = c => { const neg=c<0; c=Math.abs(c); return (neg?"−":"")+"$"+Math.floor(c/100).toLocaleString("en-US")+"."+String(c%100).padStart(2,"0"); };
const acctName = id => (ACCTS.find(a=>a.id===id)||{name:id}).name;
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => ymd(new Date());
const toCents = v => { const s=String(v).replace(/[^0-9.]/g,""); if(!/^\d*\.?\d*$/.test(s)||s==="") return NaN; return Math.round(Number(s)*100); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dayLabel(d){
  if (d===today()) return "Today";
  const y=new Date(); y.setDate(y.getDate()-1); if (d===ymd(y)) return "Yesterday";
  const [Y,M,D]=d.split("-").map(Number);
  return new Date(Y,M-1,D).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:Y===new Date().getFullYear()?undefined:"numeric"});
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }
function notice(m){ $("#notice").textContent=m||""; $("#notice").hidden=!m; }

/* ---------- server ---------- */
async function rpc(fn, args){
  let res;
  try {
    res = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/" + fn, {
      method:"POST",
      headers: Object.assign({ "apikey":CFG.SUPABASE_ANON_KEY, "Content-Type":"application/json" },
        /^eyJ/.test(CFG.SUPABASE_ANON_KEY) ? { "Authorization":"Bearer "+CFG.SUPABASE_ANON_KEY } : {}),
      body: JSON.stringify(args)
    });
  } catch(e){ throw {code:"offline"}; }
  const text = await res.text();
  if (!res.ok){
    let msg = text; try { msg = JSON.parse(text).message || text; } catch(e){}
    const m = String(msg).trim();
    if (m==="wrong_pin" && fn!=="fm_parent_ok"){ state.pin=null; state.alerts=null; pinStore.clear(); renderParentBtn(); }  // PIN was changed
    throw {code: /^[a-z_]+$/.test(m) ? m : "server", message:m};
  }
  return text ? JSON.parse(text) : null;
}
const ERR = {
  offline:"Can't reach the server. Check your internet connection and try again.",
  wrong_password:"That password didn't work.",
  wrong_pin:"That parent PIN didn't work.",
  parent_only:"Only a parent can do that. Tap Parent and enter the PIN first.",
  week_paid:"This week has already been paid, so its chores are locked.",
  future_day:"You can't check off a chore for a day that hasn't happened yet.",
  not_scheduled:"That chore isn't scheduled for this day.",
  already_paid:"This week has already been paid.",
  no_allowance:"Set the weekly allowance first.",
  no_chores:"There are no chores scheduled this week, so there's nothing to pay.",
  bad_split:"The split has to add up to 100%.",
  future_week:"You can't pay a week that hasn't started.",
  bad_days:"Pick at least one day.", bad_name:"Give the chore a name."
};
function errMsg(e){
  if (typeof e==="string") return e;
  return (e && ERR[e.code]) || "That didn't save. Try again in a moment.";
}
function weekStart(ds){ const [Y,M,D]=ds.split("-").map(Number); const d=new Date(Y,M-1,D); d.setDate(d.getDate()-d.getDay()); return ymd(d); }
function addDays(ds,n){ const [Y,M,D]=ds.split("-").map(Number); const d=new Date(Y,M-1,D+n); return ymd(d); }
async function load(){
  const from = addDays(weekStart(today()), -7*9);
  const [r, c, bk] = await Promise.all([ rpc("fm_load", {p_pw: state.pw}), rpc("fm_load_chores", {p_pw: state.pw, p_from: from}),
    rpc("fm_bank_public", {p_pw: state.pw}).catch(()=>null) ]);
  state.tx = (r.tx||[]).map(t => ({...t, created_at:Number(t.created_at)}));
  state.goal = r.goal;
  state.bank = bk;
  state.ch = { chores:c.chores||[], checks:(c.checks||[]).map(k=>({...k,checked_at:Number(k.checked_at)})), settings:c.settings||state.ch.settings, payouts:c.payouts||[], today:c.today||today() };
  render(); renderChores();
  maybeParentCheer();
  saveAppUrl();
}

/* ---------- balances & render ---------- */
function balances(){
  const b={spending:0,savings:0,gift:0};
  for (const t of state.tx){
    if (t.type==="deposit") b[t.account]+=t.amount;
    else if (t.type==="purchase") b[t.account]-=t.amount;
    else if (t.type==="transfer"){ b[t.account]-=t.amount; b[t.to_account]+=t.amount; }
  }
  return b;
}
/* ---------- card connection (Plaid) ---------- */
function renderBank(){
  const el=$("#bankCard"), bk=state.bank;
  if (!bk || (!bk.connected && !state.pin) || (!bk.ready && !bk.connected)){ el.hidden=true; el.innerHTML=""; return; }
  el.hidden=false;
  if (!bk.connected){
    el.innerHTML = `<h2>Automatic card purchases</h2>
      <div class="sub">Connect Taliya's debit card so every purchase logs itself: swipes, online orders and Apple Pay.</div>
      <div class="sub">Tip: do this in Safari or on a computer. The bank's sign-in page may not open from the home-screen app.</div>
      <div class="err" id="bk-err" role="alert"></div>
      <button type="button" class="btn primary" id="bk-connect">Connect Taliya's card</button>`;
  } else {

    el.innerHTML = `<div class="goal-row"><h2>${esc(bk.institution||"Card")} connected</h2>${bk.problem?'<span class="tag" style="color:var(--danger)">Needs attention</span>':""}</div>
      <div class="sub">${esc(bk.account||"Taliya's account")} · last checked ${esc(when)} · checks every 30 minutes</div>
      ${bk.problem && state.pin ? `<div class="err" id="bk-problem">Loading details…</div>` : bk.problem ? `<div class="sub">Ask a parent to check the card connection.</div>` : ""}
      <div class="err" id="bk-err" role="alert"></div>
      <div class="btns"><button type="button" class="btn ghost small" id="bk-sync">Check now</button>
      ${state.pin?'<button type="button" class="btn ghost small" id="bk-connect">Reconnect</button><button type="button" class="btn danger small" id="bk-off">Disconnect</button>':""}</div>`;
  }
  $("#bk-connect")?.addEventListener("click", ()=>connectBank(!!bk.connected));
  $("#bk-sync")?.addEventListener("click", async ()=>{
    try { const ok = await rpc("fm_bank_sync_now",{p_pw:state.pw}); toast(ok?"Checking for new purchases…":"Checked a moment ago");
      if (ok) setTimeout(()=>load().catch(()=>{}), 9000); }
    catch(e){ $("#bk-err").textContent=errMsg(e); }
  });
  const off=$("#bk-off"); let armed=false;
  off && off.addEventListener("click", async ()=>{
    if(!armed){ armed=true; off.textContent="Tap again"; return; }
    try { await rpc("fm_bank_disconnect",{p_pw:state.pw,p_pin:state.pin}); toast("Card disconnected"); await load(); }
    catch(e){ $("#bk-err").textContent=errMsg(e); }
  });
  if (bk.problem && state.pin){
    rpc("fm_bank_status",{p_pw:state.pw,p_pin:state.pin}).then(s=>{ const p=$("#bk-problem"); if(p) p.textContent=s.error||"The last check didn't finish. Tap Check now."; }).catch(()=>{});
  }
}
function loadPlaidScript(){
  if (window.Plaid) return Promise.resolve();
  return new Promise((ok, fail)=>{ const s=document.createElement("script"); s.src="https://cdn.plaid.com/link/v2/stable/link-initialize.js";
    s.onload=()=>ok(); s.onerror=()=>fail(new Error("plaid")); document.body.appendChild(s); });
}
async function bankFn(body){
  let res;
  try {
    res = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/functions/v1/plaid-sync", {
      method:"POST", headers:{"Content-Type":"application/json","apikey":CFG.SUPABASE_ANON_KEY},
      body: JSON.stringify(Object.assign({pw:state.pw, pin:state.pin}, body)) });
  } catch(e){ throw "Couldn't reach the plaid-sync program. Check that it's deployed in Supabase (Edge Functions) with JWT verification turned off."; }
  let data={}; try { data = await res.json(); } catch(e){}
  if (res.status===401 && !data.error) throw "Supabase blocked the request. Turn off \"Enforce JWT verification\" for plaid-sync.";
  if (res.status===404) throw "The plaid-sync program wasn't found. Check its name in Supabase Edge Functions.";
  if (!data.ok) throw (data.error || "The bank connection didn't work. Try again.");
  return data;
}
function pickAccount(accounts){
  if (accounts.length <= 1) return Promise.resolve(accounts[0] || null);
  return new Promise(resolve=>{
    openSheet(`<h3>Which account is Taliya's?</h3>
      <p class="sub" style="margin:0 0 12px">Only purchases from this account will be logged.</p>
      <div class="list">${accounts.map((a,i)=>`<button type="button" class="crow" data-acc="${i}"><span><span class="cname">${esc(a.name||"Account")}</span><span class="cwhen">${esc([a.subtype,a.mask?"ending "+a.mask:""].filter(Boolean).join(" · "))}</span></span></button>`).join("")}</div>
      <div class="btns" style="margin-top:14px"><button type="button" class="btn ghost" data-close>Cancel</button></div>`, el=>{
      el.querySelector("[data-close]").addEventListener("click", ()=>{ closeSheet(); resolve(null); });
      el.querySelectorAll("[data-acc]").forEach(b=>b.addEventListener("click", ()=>{ closeSheet(); resolve(accounts[+b.dataset.acc]); }));
    });
  });
}
async function connectBank(update){
  update = update===true;
  const err=$("#bk-err"); if (err) err.textContent="";
  const show = m => { const x=$("#bk-err"); if (x) x.textContent=m; else toast(m); };
  if (!state.pin){ requireParent(()=>connectBank(update)); return; }
  try {
    const st = await rpc("fm_bank_status",{p_pw:state.pw,p_pin:state.pin});
    if (!st || !st.ready) throw "Bank settings are missing. Run bank-setup.sql in Supabase first.";
    const [{link_token}] = await Promise.all([ bankFn({action:"link_token", update}),
      loadPlaidScript().catch(()=>{ throw "Couldn't load the secure bank sign-in. Check your connection and try again."; }) ]);
    const handler = window.Plaid.create({
      token: link_token,
      onSuccess: async (public_token, md)=>{
        try {
          if (update){ await bankFn({action:"reconnected"}); toast("Reconnected"); await load(); return; }
          const acct = await pickAccount((md && md.accounts) || []);
          if (!acct){ show("Not connected. Pick Taliya's account to finish."); return; }
          toast("Connecting…");
          await bankFn({action:"exchange", public_token, account_id:acct.id,
            account_name:[acct.name, acct.mask?"··"+acct.mask:""].filter(Boolean).join(" "),
            institution:(md && md.institution && md.institution.name) || "Bank"});
          toast("Card connected. Purchases from today on will log automatically.");
          await load(); setTimeout(()=>load().catch(()=>{}), 15000);
        } catch(e){ show(errMsg(e)); await load().catch(()=>{}); }
      },
      onExit: (e)=>{ if (e && (e.display_message || e.error_message)) show(e.display_message || e.error_message); }
    });
    handler.open();
  } catch(e){ show(errMsg(e)); }
}

function render(){
  renderBank();
  const b=balances(), total=b.spending+b.savings+b.gift, tf=fmt(total), dot=tf.lastIndexOf(".");
  $("#total").innerHTML = esc(tf.slice(0,dot))+"<small>"+esc(tf.slice(dot))+"</small>";
  $("#accounts").innerHTML = ACCTS.map(a=>`<button type="button" class="acct t-${a.id}" data-acct="${a.id}" aria-pressed="${state.filter===a.id}">
    <span class="lbl"><span class="dot"></span>${a.name}</span><span class="amt num">${fmt(b[a.id])}</span></button>`).join("");

  const g=state.goal;
  if (g && g.target>0){
    const pct=Math.max(0,Math.min(100,Math.round(b.savings/g.target*100))), left=g.target-b.savings;
    $("#goalTitle").textContent="Saving for: "+g.name;
    $("#goalBar").style.width=pct+"%";
    $("#goalText").textContent = left>0 ? `${fmt(b.savings)} of ${fmt(g.target)} · ${fmt(left)} to go (${pct}%)` : `Goal reached! ${fmt(b.savings)} saved of ${fmt(g.target)}`;
    $("#btnGoal").textContent="Change";
  } else {
    $("#goalTitle").textContent="Savings goal"; $("#goalBar").style.width="0";
    $("#goalText").textContent="Pick something to save for and watch savings fill this bar.";
    $("#btnGoal").textContent="Set a goal";
  }

  const opts=[["all","All"],["spending","Spending"],["savings","Savings"],["gift","Gifts"],["receipts","Receipts"]];
  $("#chips").innerHTML = opts.map(([k,l])=>`<button type="button" class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join("");

  const f=state.filter;
  let rows=state.tx.slice();
  if (f==="receipts") rows=rows.filter(t=>t.has_receipt);
  else if (f!=="all") rows=rows.filter(t=>t.account===f||t.to_account===f);
  rows.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created_at||0)-(a.created_at||0));

  if (!rows.length){
    $("#list").innerHTML = state.tx.length
      ? `<div class="empty"><b>Nothing here yet</b><span>No ${f==="receipts"?"purchases with receipts":acctName(f).toLowerCase()+" activity"} so far.</span></div>`
      : `<div class="empty"><b>No activity yet</b><span>Start with Taliya's current balances: tap <strong>Add money</strong> and enter what's in each account today as an opening balance.</span></div>`;
    return;
  }
  let html="", last=null;
  for (const t of rows){
    if (t.date!==last){ html+=`<div class="day">${esc(dayLabel(t.date))}</div>`; last=t.date; }
    let title, sub, sign="", tone=t.account;
    if (t.type==="deposit"){ title=t.note||"Money added"; sub=`Into ${acctName(t.account)}`+(t.from_who?` · from ${t.from_who}`:""); sign="+"; }
    else if (t.type==="purchase"){ title=t.store||"Purchase"; sub=acctName(t.account)+(t.note?` · ${t.note}`:""); sign="−"; }
    else { title=`${acctName(t.account)} → ${acctName(t.to_account)}`; sub=t.note||"Moved money"; tone=t.to_account; if(f===t.account)sign="−"; else if(f===t.to_account)sign="+"; }
    const tags = (t.source==="apple pay"?'<span class="tag pay">Apple Pay</span>':"")+(t.source==="bank"?'<span class="tag pay">Card</span>':"")
      +(t.bank_status==="pending"?'<span class="tag">Pending</span>':"")+(t.has_receipt?'<span class="tag">Receipt</span>':"");
    html+=`<button type="button" class="row t-${tone}" data-detail="${esc(t.id)}">
      <span class="ico">${ICON[t.type]}</span>
      <span class="what"><b>${esc(title)}</b><span>${esc(sub)}</span></span>
      <span class="right"><span class="money num ${sign==="+"?"plus":""}">${sign}${fmt(t.amount)}</span>${tags?`<span class="tags">${tags}</span>`:""}</span>
    </button>`;
  }
  $("#list").innerHTML=html;
}

function bindForm(el, build, done){
  el.querySelector("[data-close]").addEventListener("click", closeSheet);
  el.querySelector("form").addEventListener("submit", async e=>{
    e.preventDefault();
    const err=el.querySelector("#err"), btn=el.querySelector("#submitBtn"), label=btn.textContent;

async function compress(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1200/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.72);
}
async function saveReceipt(id, file){
  let data;
  try { data = await compress(file); } catch(e){ throw "That photo couldn't be read. Try a different one."; }
  await rpc("fm_save_receipt",{p_pw:state.pw,p_id:id,p_image:data});
  state.receiptCache[id]=data;
}

function sheetDetail(id){

const isDone = (cid, ds) => state.ch.checks.find(k=>k.chore_id===cid && k.date===ds);
function weekStats(ws){
  let total=0, done=0;
  for (let i=0;i<7;i++){ const ds=addDays(ws,i); for (const c of state.ch.chores){ if (scheduledOn(c,ds)){ total++; if (isDone(c.id,ds)) done++; } } }
  const s=state.ch.settings, amount = total ? Math.round(s.allowance*done/total) : 0;
  const sp=Math.round(amount*s.spending/100); let sv=Math.round(amount*s.savings/100); let gf=amount-sp-sv;
  if (s.gift===0){ sv+=gf; gf=0; }
  return {total, done, pct: total?Math.round(100*done/total):0, amount, sp, sv, gf};
}

    state.forceCheer = false; clearCheerHash();
    if (todayAllDone()){ cheerStore.set(td); celebrate(true); return; }
  }
  if (!state.pin || !todayAllDone()) return;
  if (cheerStore.get() === td) return;

function celebrate(forParent, preview){
  if (!forParent && !preview) cheerStore.set(state.ch.today || today());   // this phone already celebrated today
  document.querySelector(".cheer")?.remove();
  const el=document.createElement("div"); el.className="cheer"; el.setAttribute("role","status");
  let hands="";
  for (let i=0;i<22;i++){
    const left=Math.round(Math.random()*92), size=28+Math.round(Math.random()*34), dur=(2.4+Math.random()*1.4).toFixed(2), delay=(Math.random()*1.1).toFixed(2);
    hands+=`<span class="hand" aria-hidden="true" style="left:${left}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s">👏</span>`;
  }
  el.innerHTML = hands + (forParent
    ? `<div class="msg">Taliya finished all her chores today!</div>`
    : `<div class="msg">Nice job, Taliya!<span>Keep up the great work!</span></div>`);
  const close=()=>el.remove();
  el.addEventListener("click", close);
  el.addEventListener("animationend", e=>{ if (e.target===el) close(); });
  document.body.appendChild(el);
  setTimeout(close, 4500);
}
async function toggleChore(cid){

  renderChores();
  const dayList = state.ch.chores.filter(c=>scheduledOn(c,day));
  const allDone = !was && dayList.length>0 && dayList.every(c=>isDone(c.id,day));
  try {
    await rpc("fm_toggle_chore",{p_pw:state.pw,p_chore:cid,p_date:day,p_done:!was,p_pin:state.pin});
    if (allDone) celebrate(); else if(!was) toast("Nice work!");
  }
  catch(e){ toast(errMsg(e)); }
  try { await load(); } catch(e){}
}
function sheetChore(id){
  const c = id ? state.ch.chores.find(x=>x.id===id) : {name:"",days:[]};
  openSheet(`<h3>${id?"Edit chore":"Add a chore"}</h3><form>
    <label class="f">Chore<input id="f-cname" name="name" value="${esc(c.name)}" placeholder="Unload dishwasher, feed the dog…" maxlength="60" required></label>
    <label class="f">Which days?<div class="dpick">${DAYS.map((d,i)=>`<label><input type="checkbox" name="d" id="f-d${i}" value="${i}" ${c.days.includes(i)?"checked":""}><span>${d.slice(0,2)}</span></label>`).join("")}</div></label>
    <button type="button" class="link" id="everyDay" style="align-self:flex-start">Select every day</button>
    <div class="err" id="err" role="alert"></div>
    <div class="btns">${id?'<button type="button" class="btn danger" id="rmChore">Remove</button>':'<button type="button" class="btn ghost" data-close>Cancel</button>'}<button type="submit" class="btn primary" id="submitBtn">Save</button></div>
  </form>`, el=>{
    el.querySelector("[data-close]")?.addEventListener("click", closeSheet);
    el.querySelector("#everyDay").addEventListener("click", ()=>el.querySelectorAll('input[name=d]').forEach(x=>x.checked=true));
    const rm=el.querySelector("#rmChore"); let armed=false;
    rm && rm.addEventListener("click", async ()=>{
      if(!armed){ armed=true; rm.textContent="Tap again to remove"; return; }
      try { await rpc("fm_chore_remove",{p_pw:state.pw,p_pin:state.pin,p_id:id}); closeSheet(); toast("Chore removed"); await load(); }
      catch(e){ el.querySelector("#err").textContent=errMsg(e); }
    });
    el.querySelector("form").addEventListener("submit", async e=>{
      e.preventDefault();
      const fd=new FormData(e.target), days=fd.getAll("d").map(Number), name=fd.get("name").trim(), err=el.querySelector("#err");
      if(!name) return err.textContent=ERR.bad_name;
      if(!days.length) return err.textContent=ERR.bad_days;
      try { await rpc("fm_chore_save",{p_pw:state.pw,p_pin:state.pin,p_name:name,p_days:days,p_id:id||null}); closeSheet(); toast("Chore saved"); await load(); }
      catch(ex){ err.textContent=errMsg(ex); }
    });
  });
}
function sheetAllowance(){
  const s=state.ch.settings;
  openSheet(`<h3>Weekly allowance</h3><form>
    <label class="f">Full allowance (when every chore is done)<input class="amount-in num" id="f-allow" name="allow" inputmode="decimal" value="${s.allowance?(s.allowance/100).toFixed(2):""}" placeholder="$0.00" required></label>
    <label class="f">How payday is split</label>
    <div class="three">
      <label class="f t-spending">Spending %<input id="f-sp" name="sp" inputmode="numeric" value="${s.spending}"></label>
      <label class="f t-savings">Savings %<input id="f-sv" name="sv" inputmode="numeric" value="${s.savings}"></label>
      <label class="f t-gift">Gifts %<input id="f-gf" name="gf" inputmode="numeric" value="${s.gift}"></label>
    </div>
    <div class="sub num" id="splitTotal"></div>
    <p class="sub" style="margin:0">She earns the share of the allowance that matches the share of chores she finished. Finish 8 of 10 chores and she gets 80%.</p>
    ${footer("Save")}</form>`, el=>{
    const upd=()=>{ const t=["sp","sv","gf"].map(n=>parseInt(el.querySelector(`[name=${n}]`).value||"0",10)).reduce((a,b)=>a+b,0); el.querySelector("#splitTotal").textContent=`Total: ${t}%${t===100?"":" (needs to be 100%)"}`; };
    el.querySelectorAll(".three input").forEach(i=>i.addEventListener("input",upd)); upd();
    el.querySelector("[data-close]").addEventListener("click", closeSheet);
    el.querySelector("form").addEventListener("submit", async e=>{
      e.preventDefault();
      const fd=new FormData(e.target), err=el.querySelector("#err"), allow=toCents(fd.get("allow"));
      const [sp,sv,gf]=["sp","sv","gf"].map(n=>parseInt(fd.get(n)||"0",10));
      if(!(allow>=0)) return err.textContent="Enter the weekly allowance.";
      if([sp,sv,gf].some(x=>isNaN(x)||x<0) || sp+sv+gf!==100) return err.textContent=ERR.bad_split;
      try { await rpc("fm_allowance_save",{p_pw:state.pw,p_pin:state.pin,p_allowance:allow,p_spending:sp,p_savings:sv,p_gift:gf}); closeSheet(); toast("Allowance saved"); await load(); }
      catch(ex){ err.textContent=errMsg(ex); }
    });
  });
}
function setTab(t){
  state.tab=t; $("#tabMoney").setAttribute("aria-selected", t==="money"); $("#tabChores").setAttribute("aria-selected", t==="chores");
  $("#moneyView").hidden = t!=="money"; $("#choresView").hidden = t!=="chores";
  if (t==="chores") renderChores();
}
$("#tabMoney").addEventListener("click", ()=>setTab("money"));
$("#tabChores").addEventListener("click", ()=>setTab("chores"));
$("#wkPrev").addEventListener("click", ()=>{ state.wk--; state.day=null; renderChores(); });
$("#wkNext").addEventListener("click", ()=>{ state.wk=Math.min(0,state.wk+1); state.day=null; renderChores(); });

/* ---------- events ---------- */
$("#btnAdd").addEventListener("click", ()=>requireParent(sheetAdd));
$("#btnBuy").addEventListener("click", sheetBuy);
$("#btnMove").addEventListener("click", ()=>requireParent(sheetMove));
$("#btnGoal").addEventListener("click", sheetGoal);
$("#btnLock").addEventListener("click", ()=>{ store.clear(); pinStore.clear(); state.pw=null; state.pin=null; state.alerts=null; state.tx=[]; renderParentBtn(); showLogin(); });
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-acct]"); if(a){ state.filter = state.filter===a.dataset.acct?"all":a.dataset.acct; render(); return; }
  const f=e.target.closest("[data-filter]"); if(f){ state.filter=f.dataset.filter; render(); return; }
  const d=e.target.closest("[data-detail]"); if(d){ sheetDetail(d.dataset.detail); return; }
  const dy=e.target.closest("[data-day]"); if(dy){ state.day=dy.dataset.day; renderChores(); return; }
  const ck=e.target.closest("[data-chore]"); if(ck && !ck.disabled){ toggleChore(ck.dataset.chore); return; }
  const ec=e.target.closest("[data-editchore]"); if(ec) sheetChore(ec.dataset.editchore);
});

/* ---------- login & refresh ---------- */
function showLogin(msg){ $("#app").hidden=true; $("#login").hidden=false; $("#loginErr").textContent=msg||""; $("#pw").value=""; }
function showApp(){ $("#login").hidden=true; $("#app").hidden=false; }
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"); btn.disabled=true; btn.textContent="Opening…"; $("#loginErr").textContent="";
  state.pw=$("#pw").value;
  try { await load(); if($("#remember").checked) store.set(state.pw); showApp(); maybeParentCheer(); }
  catch(ex){ state.pw=null; $("#loginErr").textContent=errMsg(ex); }
  btn.disabled=false; btn.textContent="Open";
});
async function refresh(){
  if (!state.pw || document.hidden) return;
  try { await load(); notice(""); }
  catch(e){ if(e.code==="wrong_password"){ store.clear(); state.pw=null; showLogin("The family password changed. Enter the new one."); } else notice(errMsg(e)); }
}
document.addEventListener("visibilitychange", refresh);

/* ---------- keep every phone on the newest version ---------- */
const APP_VERSION = "2026-10-27.2";
$("#appVersion").textContent = "App version " + APP_VERSION;
async function checkForUpdate(){
  if (document.hidden || !/^https?:/.test(location.protocol)) return;
  if (!$("#scrim").hidden || document.querySelector(".cheer")) return;      // don't interrupt
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), {cache:"no-store"});
    if (!res.ok) return;
    const m = (await res.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION){
      try { sessionStorage.setItem("taliya-money-updated", m[1]); } catch(e){}
      location.reload();
    }
  } catch(e){ /* offline: try again later */ }
}
document.addEventListener("visibilitychange", checkForUpdate);
setInterval(checkForUpdate, 15*60*1000);
setTimeout(checkForUpdate, 3000);
try { const u = sessionStorage.getItem("taliya-money-updated"); if (u){ sessionStorage.removeItem("taliya-money-updated"); setTimeout(()=>toast("App updated"), 600); } } catch(e){}
setInterval(refresh, 30000);

render();
if (!CFG || /YOUR-/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)){
  showLogin("This app isn't connected yet. Put your Supabase URL and key in config.js and upload it next to index.html.");
  $("#loginBtn").disabled=true;
} else {
  const saved=store.get();
  state.pin = pinStore.get(); renderParentBtn();
  if (saved){ state.pw=saved; showApp(); load().catch(e=>{ if(e.code==="wrong_password"){ store.clear(); state.pw=null; showLogin("Enter the family password."); } else notice(errMsg(e)); }); }
  else showLogin();
}
})();
</script>
</body>
